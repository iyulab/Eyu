name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same ref supersedes an in-flight run (saves Actions minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  lint:
    runs-on: ubuntu-latest
    env:
      IncludeEyuLlmLiveTests: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      # The live-test files are removed from the default compilation, so nothing in the build job
      # sees them: measured, a call to a method that does not exist in one of them passes both
      # `dotnet build` (file excluded) and `dotnet format` (which reports formatting, not semantic
      # errors). Compiling them here is what catches that. The build job cannot do it -- turning
      # the flag on there would make its `dotnet test` try to reach a live model. Building is
      # enough; running these tests needs an endpoint, which CI does not have.
      #
      # The same flag also opens the formatting gate over those files. Measured when it was added:
      # green by default, 580 violations in two files with the flag on. `dotnet format` takes no
      # -p:, but MSBuild reads environment variables as properties, which is why this is `env`.
      - name: Compile the live-only test configuration
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Published text must not name something only an insider can look up. Needs no dotnet, so
      # it runs before the SDK is set up and fails the job in seconds when it fails.
      - name: Internal token scan
        uses: iyulab/dotnet-ci-actions/internal-token-scan@7e501c0d46f7c06e73a8945f4b0f83fcb347eb53 # main, 2026-09-06
        with:
          # The evaluation corpus the live measurement draws from lives in a private tree
          # outside this repository. A path into it resolves for nobody reading the published
          # source, so the catalog names the dataset (NRC Licensee Event Reports, FAA Service
          # Difficulty Reports) instead of the file it was sliced from. The character class in
          # the pattern below keeps it from matching itself -- this file is scanned too.
          extra-patterns: '\bleague[/]'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run security scan
        uses: iyulab/dotnet-ci-actions/vulnerability-scan@00faf7ff62b88e11fbf88edfedcf73bdc5f2eebe # main, 2026-08-31
